name: Build Vectras PRO

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          for attempt in 1 2; do
            ./gradlew --no-daemon assembleDebug && exit 0
            echo "Build attempt $attempt failed, retrying..."
            sleep 20
          done
          exit 1

      - name: Collect APKs
        run: |
          mkdir -p out
          ls -la app/build/outputs/apk/debug/
          APK=$(ls app/build/outputs/apk/debug/*arm64-v8a*.apk 2>/dev/null | head -n1)
          [ -n "$APK" ] || APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          cp "$APK" out/Vectras-PRO.apk
          cd out && sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vectras-PRO-APK
          path: out/
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pro-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/*.apk out/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Vectras PRO - build ${GITHUB_RUN_NUMBER}" \
            --notes "Vectras PRO: porta COM ligada ao cabo USB serial, disco rapido e otimizacao para Windows. Baixe Vectras-PRO.apk (celulares 64 bits)."
